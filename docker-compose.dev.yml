# Local development database with PostGIS. The API runs on the host: `bun run db:up && bun run dev`.
services:
  postgres:
    image: imresamu/postgis:18-3.6
    container_name: thataway-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thataway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thataway}
      POSTGRES_DB: ${POSTGRES_DB:-thataway}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    name: thataway-postgres-data-dev
