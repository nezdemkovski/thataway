# Local development database with PostGIS and an S3 (RustFS, as on the homelab's NAS) for the
# illustrations. The API runs on the host: `bun run db:up && bun run dev`.
services:
  postgres:
    image: imresamu/postgis:18-3.6
    container_name: thataway-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thataway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thataway}
      POSTGRES_DB: ${POSTGRES_DB:-thataway}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: thataway-rustfs-dev
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-thataway}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-thataway-dev}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfs-data:/data

volumes:
  postgres-data:
    name: thataway-postgres-data-dev
  rustfs-data:
    name: thataway-rustfs-data-dev
