# The API contract, maintained by hand with every route change (the routes carry the same
# typebox schemas, and apps/api/tests/openapi.test.ts keeps the two from drifting). The iOS app
# copies this file and generates its client from it: ~/Apps/Thataway/scripts/sync-openapi.sh.
openapi: 3.0.3
info:
  title: Thataway API
  description: Places worth walking to around a point, most notable first.
  version: 0.3.0
servers:
  - url: https://thataway.nezdemkovski.cloud
tags:
  - name: places
  - name: health
  - name: art-worker
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: The service and the database behind it
      responses:
        "200":
          description: Up, and the database answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Up, but the database does not answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /places:
    get:
      operationId: getPlaces
      tags: [places]
      summary: Places around a point, most notable first
      description: >-
        Asks for the geohash tile under the point and its neighbours. Tiles nobody has visited
        yet are filled on the spot: the places arrive within a few seconds, their page views
        and photos a little later. Until all of it has landed `warming` is true: ask again in
        a few seconds.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radius
          in: query
          description: Metres around the point
          schema:
            type: integer
            minimum: 100
            maximum: 10000
            default: 2500
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 60
      responses:
        "200":
          description: The places, ranked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacesResult"
        "400":
          description: A parameter is missing or out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests; wait for Retry-After seconds
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Something broke on our side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /art/jobs/claim:
    post:
      operationId: claimArtJob
      tags: [art-worker]
      summary: Take the next place to illustrate
      description: For the art worker on the Mac, not the app. Needs the worker token.
      security:
        - workerToken: []
      responses:
        "200":
          description: The place to draw with the full prompt and the photo to draw from, or null
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/ArtJob"
        "401":
          description: Not the worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /art/jobs/{id}/complete:
    post:
      operationId: completeArtJob
      tags: [art-worker]
      summary: Hand in the finished illustration
      security:
        - workerToken: []
      parameters:
        - $ref: "#/components/parameters/ArtJobId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model, anchorX, width, height]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG with alpha, cut to the landmark
                model:
                  $ref: "#/components/schemas/ArtModel"
                seed:
                  type: integer
                anchorX:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 1
                  description: Where the tallest element stands, 0..1 across the picture
                width:
                  type: integer
                height:
                  type: integer
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [placeId, artUrl]
                properties:
                  placeId:
                    type: string
                  artUrl:
                    type: string
        "401":
          description: Not the worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /art/jobs/{id}/fail:
    post:
      operationId: failArtJob
      tags: [art-worker]
      summary: Give a job back after a failure
      security:
        - workerToken: []
      parameters:
        - $ref: "#/components/parameters/ArtJobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error:
                  type: string
      responses:
        "204":
          description: Noted
        "401":
          description: Not the worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    workerToken:
      type: http
      scheme: bearer
      description: The art worker's token, shared through 1Password
  parameters:
    ArtJobId:
      name: id
      in: path
      required: true
      description: The place's Wikidata id
      schema:
        type: string
        pattern: '^Q\\d+$'
        example: Q204871
  schemas:
    ArtModel:
      type: string
      enum: [qwen-image-2.1-turbo, manual]
    ArtJob:
      type: object
      required: [placeId, name, kind, prompt]
      properties:
        placeId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/PlaceKind"
        prompt:
          type: string
          description: The full prompt, style and place
        referenceImageUrl:
          type: string
          nullable: true
          description: The Commons photo to draw the shape from
        referenceImageLicense:
          type: string
          nullable: true
    HealthStatus:
      type: string
      enum: [ok, degraded]
    Health:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: Bad Request
        message:
          type: string
    PlaceKind:
      description: What the place looks like on the map; the app draws a glyph per kind
      type: string
      enum: [church, tower, bridge, museum, park, monument, square, castle, place]
    Place:
      type: object
      required: [id, name, kind, latitude, longitude, distance, sitelinks, heritage, views]
      properties:
        id:
          type: string
          description: Wikidata item id
          example: Q190807
        name:
          type: string
          example: Charles Bridge
        description:
          type: string
          nullable: true
          description: Wikidata's one-line description
          example: historic bridge in Prague, Czech Republic
        kind:
          $ref: "#/components/schemas/PlaceKind"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        distance:
          type: integer
          description: Metres from the query point
        sitelinks:
          type: integer
          description: Language editions with an article, the fame that needs no traffic
        heritage:
          type: boolean
          description: Listed as cultural heritage
        views:
          type: integer
          description: English Wikipedia page views over the last few days
        enwikiTitle:
          type: string
          nullable: true
          description: Title of the English Wikipedia article, when there is one
        imageUrl:
          type: string
          nullable: true
          description: A 640 px thumbnail from Wikimedia Commons
        imageAuthor:
          type: string
          nullable: true
          description: Who to credit for the image
        imageLicense:
          type: string
          nullable: true
          description: The image's licence, as Commons names it
          example: CC BY-SA 4.0
        artUrl:
          type: string
          nullable: true
          description: The generated illustration in the art bucket, when there is one
    PlacesResult:
      type: object
      required: [warming, places]
      properties:
        warming:
          type: boolean
          description: Places, page views or photos around the point are still on their way; ask again in a few seconds
        places:
          type: array
          items:
            $ref: "#/components/schemas/Place"
